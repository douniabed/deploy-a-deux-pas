# ===================================================================
# DOCKER PROFILE CONFIGURATION
# ===================================================================
# Non-secret values are hardcoded here.
# Secrets use ${VAR} placeholders resolved from environment variables.

# Identifying the application
spring.application.name=back-a-deux-pas

# Set the port number
server.port=8081

# ===================================================================
# DATABASE CONFIGURATION (MySQL)
# ===================================================================
# Secrets from Jenkins credential: mysql-credentials
spring.datasource.url=jdbc:mysql://mysql:3306/adeuxpas-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Paris&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===================================================================
# JWT CONFIGURATION
# ===================================================================
# Secret from Jenkins credential: jwt-secret
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.expiration.remember=604800000

# ===================================================================
# CLOUDINARY CONFIGURATION
# ===================================================================
# Secrets from Jenkins credentials: cloudinary-api-key, cloudinary-api-secret
cloudinary.url=https://res.cloudinary.com/erikaadeuxpas/image/upload/
cloudinary.cloud_name=erikaadeuxpas
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# ===================================================================
# STRIPE CONFIGURATION
# ===================================================================
# Secrets from Jenkins credentials: stripe-api-key, stripe-webhook-secret
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ===================================================================
# MAPBOX CONFIGURATION
# ===================================================================
# Secret from Jenkins credential: mapbox-token
mapbox.access.token=${MAPBOX_ACCESS_TOKEN}

# ===================================================================
# SEED USERS PASSWORDS (for dev/test environments)
# ===================================================================
first.pass=password1
second.pass=password2
third.pass=password3
fourth.pass=password4
fifth.pass=password5
sixth.pass=password6
seventh.pass=password7
eighth.pass=password8

# ===================================================================
# CORS CONFIGURATION
# ===================================================================
cors.allowed.origins=http://localhost,http://localhost:4200,http://51.44.22.28,https://magnolia.readresolve.tech

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.com.adeuxpas=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.web=INFO
