services:
  mysql:
    image: mysql:8
    container_name: adeuxpas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_CREDENTIALS_PSW}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adeuxpas-db}
      MYSQL_USER: ${MYSQL_CREDENTIALS_USR}
      MYSQL_PASSWORD: ${MYSQL_CREDENTIALS_PSW}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: douniabed/back-a-deux-pas:${BACK_VERSION:-latest-snapshot}
    container_name: adeuxpas-backend
    ports:
      - "${BACK_PORT:-8081}:8081"
    environment:
      # Spring profile (loads application-docker.properties)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-docker}
      # Explicitly tell Spring to load external config from /app/config/
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/

      # Secrets only - non-secrets are hardcoded in application-docker.properties
      # These env vars are resolved by Spring Boot ${VAR} placeholders

      # Jenkins credential: mysql-credentials (provides MYSQL_CREDENTIALS_USR/PSW)
      MYSQL_USER: ${MYSQL_CREDENTIALS_USR}
      MYSQL_PASSWORD: ${MYSQL_CREDENTIALS_PSW}

      # Jenkins credential: jwt-secret
      JWT_SECRET: ${JWT_SECRET}

      # Jenkins credentials: cloudinary-api-key, cloudinary-api-secret
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Jenkins credentials: stripe-api-key, stripe-webhook-secret
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # Jenkins credential: mapbox-token
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN}
    volumes:
      # Properties file (non-secrets hardcoded, secrets use ${VAR} placeholders)
      # Mount to /app/config/ so Spring Boot auto-discovers it
      - ./config/application-${SPRING_PROFILE:-docker}.properties:/app/config/application-${SPRING_PROFILE:-docker}.properties:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: douniabed/front-a-deux-pas:${FRONT_VERSION:-latest-snapshot}
    container_name: adeuxpas-frontend
    ports:
      - "${FRONT_PORT:-1080}:1080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
