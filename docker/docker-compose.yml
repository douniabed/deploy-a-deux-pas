services:
  mysql:
    image: mysql:8
    container_name: adeuxpas-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adeuxpas}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: douniabed/back-a-deux-pas:${BACK_VERSION:-latest-snapshot}
    container_name: adeuxpas-backend
    ports:
      - "${BACK_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-adeuxpas}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: douniabed/front-a-deux-pas:${FRONT_VERSION:-latest-snapshot}
    container_name: adeuxpas-frontend
    ports:
      - "${FRONT_PORT:-1080}:1080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
