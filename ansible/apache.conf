<IfModule mod_ssl.c>
        <VirtualHost *:443>
                ServerName magnolia.readresolve.tech

                DocumentRoot /srv/readresolve.tech/magnolia/www

                ErrorLog /var/readresolve.tech/magnolia/logs/www/https-error.log

                <Directory "/srv/readresolve.tech/magnolia/www">
                        SetEnv www

                        AuthType Basic
                        AuthName "Restricted Area"
                        AuthUserFile /etc/apache2/.htpasswd
                        Require valid-user
                </Directory>

                <Directory "/srv/readresolve.tech/magnolia/www/web-context-1">
                        SetEnv web-context-1
                        RewriteEngine On
                        RewriteRule ^index\.html$ - [L]
                        RewriteCond %{REQUEST_URI} !^/web-context-1/(assets|static)/
                        RewriteRule . /web-context-1/index.html [L]
                </Directory>

                <Directory "/srv/readresolve.tech/magnolia/www/web-context-2">
                        SetEnv web-context-2
                        RewriteEngine On
                        RewriteRule ^index\.html$ - [L]
                        RewriteCond %{REQUEST_URI} !^/web-context-2/(assets|static)/
                        RewriteRule . /web-context-2/index.html [L]
                </Directory>

                <Directory "/srv/readresolve.tech/magnolia/www/web-context-3">
                        SetEnv web-context-3
                        RewriteEngine On
                        RewriteRule ^index\.html$ - [L]
                        RewriteCond %{REQUEST_URI} !^/web-context-3/(assets|static)/
                        RewriteRule . /web-context-3/index.html [L]
                </Directory>

                # A Deux Pas - PROD Frontend
                <Directory "/srv/readresolve.tech/magnolia/www/a-deux-pas-prod">
                        SetEnv a-deux-pas-prod
                        RewriteEngine On
                        RewriteRule ^index\.html$ - [L]
                        RewriteCond %{REQUEST_FILENAME} !-f
                        RewriteCond %{REQUEST_FILENAME} !-d
                        RewriteRule . /a-deux-pas-prod/index.html [L]
                        Require all granted
                </Directory>

                # A Deux Pas - DEV Frontend
                <Directory "/srv/readresolve.tech/magnolia/www/a-deux-pas-dev">
                        SetEnv a-deux-pas-dev
                        RewriteEngine On
                        RewriteRule ^index\.html$ - [L]
                        RewriteCond %{REQUEST_FILENAME} !-f
                        RewriteCond %{REQUEST_FILENAME} !-d
                        RewriteRule . /a-deux-pas-dev/index.html [L]
                        Require all granted
                </Directory>

                # A Deux Pas - PROD API Proxy (backend runs on port 8902)
                <Location /a-deux-pas-prod/api>
                        Require all granted
                </Location>
                ProxyPass /a-deux-pas-prod/api http://127.0.0.1:8902/api nocanon
                ProxyPassReverse /a-deux-pas-prod/api http://127.0.0.1:8902/api

                # A Deux Pas - DEV API Proxy (backend runs on port 8901)
                <Location /a-deux-pas-dev/api>
                        Require all granted
                </Location>
                ProxyPass /a-deux-pas-dev/api http://127.0.0.1:8901/api nocanon
                ProxyPassReverse /a-deux-pas-dev/api http://127.0.0.1:8901/api

                CustomLog /var/readresolve.tech/magnolia/logs/www/https-access.log combined env=www
                CustomLog /var/readresolve.tech/magnolia/logs/www/web-context-1/https-access.log combined env=web-context-1
                CustomLog /var/readresolve.tech/magnolia/logs/www/web-context-2/https-access.log combined env=web-context-2
                CustomLog /var/readresolve.tech/magnolia/logs/www/web-context-3/https-access.log combined env=web-context-3
                CustomLog /var/readresolve.tech/magnolia/logs/www/a-deux-pas-prod/https-access.log combined env=a-deux-pas-prod
                CustomLog /var/readresolve.tech/magnolia/logs/www/a-deux-pas-dev/https-access.log combined env=a-deux-pas-dev

                Include /etc/letsencrypt/options-ssl-apache.conf
                SSLCertificateFile /etc/letsencrypt/live/readresolve.tech-0002/fullchain.pem
                SSLCertificateKeyFile /etc/letsencrypt/live/readresolve.tech-0002/privkey.pem
        </VirtualHost>
</IfModule>
